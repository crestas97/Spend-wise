resolver 127.0.0.11 valid=10s ipv6=off;

log_format json_logs escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout json_logs;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    set $backend_upstream  http://backend:5000;
    set $frontend_upstream http://frontend:80;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
        access_log off;
        proxy_pass $backend_upstream;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
