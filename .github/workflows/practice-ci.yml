name: Practice CI/CD

on:
  push:
    branches: [devops/build]
  pull_request:
    branches: [devops/build]

permissions:
  contents: read

concurrency:
  group: practice-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets or junk tracked in Git
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|\.pem$|id_rsa|id_ed25519|\.key$|github-actions-key|\.db$|node_modules/|(^|/)venv/' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"
            echo "$bad"
            exit 1
          fi
          test -f .env.example || { echo ".env.example is missing"; exit 1; }
          echo "Repository looks clean."

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly what the lock file says
        run: npm ci
      - name: Build
        run: npm run build

  smoke-test:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway .env for this run
        run: |
          {
            echo "POSTGRES_USER=ci_user"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=ci_db"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the whole stack
        run: docker compose up --build -d
      - name: Wait until the app answers
        run: curl -fsS --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost/health
      - name: Smoke test
        run: bash monitoring/check.sh http://localhost
      - name: Show logs if something failed
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80
      - name: Clean up
        if: always()
        run: docker compose down -v

  publish:
    needs: [repo-hygiene, backend-tests, frontend-build, smoke-test]
    if: github.event_name == 'push' && vars.PRACTICE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.PRACTICE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PRACTICE_DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.PRACTICE_DOCKERHUB_USERNAME }}/spendwise-practice-backend:latest
            ${{ secrets.PRACTICE_DOCKERHUB_USERNAME }}/spendwise-practice-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.PRACTICE_DOCKERHUB_USERNAME }}/spendwise-practice-frontend:latest
            ${{ secrets.PRACTICE_DOCKERHUB_USERNAME }}/spendwise-practice-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: publish
    if: github.event_name == 'push' && vars.PRACTICE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency: practice-deploy
    steps:
      - name: Update the VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRACTICE_VM_HOST }}
          username: ${{ secrets.PRACTICE_VM_USER }}
          key: ${{ secrets.PRACTICE_VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/spendwise-practice
            git pull --ff-only
            docker compose pull
            docker compose up -d --no-build --remove-orphans
            sleep 20
            bash monitoring/check.sh http://localhost
            docker image prune -f
